<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>饥荒大乱斗 · Don't Starve LOL</title>
  <style>
    :root {
      --ink: #2b2620;
      --paper: #d8c9a3;
      --paper-dark: #b3a175;
      --blood: #8f2f27;
      --mana: #3d6a8f;
      --gold: #c9a227;
      --hp: #7a9c3e;
      --font: 'Segoe Print', 'KaiTi', '楷体', 'STKaiti', cursive, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #14110c; font-family: var(--font); }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- 通用 ---------- */
    .hidden { display: none !important; }
    .paper-panel {
      background: radial-gradient(ellipse at center, #e2d4ae 0%, #d8c9a3 55%, #c0ae82 100%);
      border: 3px solid var(--ink);
      border-radius: 14px 18px 15px 17px / 17px 14px 18px 15px;
      box-shadow: 0 6px 24px rgba(0,0,0,.6), inset 0 0 40px rgba(90,70,40,.25);
      color: var(--ink);
    }

    /* ---------- 英雄选择 ---------- */
    #hero-select {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #2a241a 0%, #14110c 80%);
      gap: 24px; padding: 20px;
    }
    #hero-select h1 {
      color: var(--paper); font-size: 52px; letter-spacing: 8px;
      text-shadow: 0 4px 0 #000, 0 0 30px rgba(200,170,90,.35);
      transform: rotate(-1.2deg);
    }
    #hero-select .subtitle { color: #9c8f6d; font-size: 18px; margin-top: -14px; transform: rotate(.6deg); }
    #hero-cards { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
    .hero-card {
      width: 240px; padding: 16px 16px 14px; cursor: pointer;
      transition: transform .15s ease; text-align: center; position: relative;
    }
    .hero-card:hover { transform: translateY(-8px) rotate(-.8deg) scale(1.03); }
    .hero-card.selected { outline: 4px solid var(--gold); transform: translateY(-8px) scale(1.04); }
    .hero-card canvas { width: 150px; height: 150px; image-rendering: auto; }
    .hero-card h2 { font-size: 26px; margin: 6px 0 2px; }
    .hero-card .role { font-size: 14px; color: #6d5c35; margin-bottom: 8px; }
    .hero-card .skills { text-align: left; font-size: 13px; line-height: 1.45; }
    .hero-card .skills b { color: var(--blood); }
    #start-btn {
      font-family: var(--font); font-size: 26px; padding: 12px 60px; cursor: pointer;
      background: linear-gradient(#c9a227, #a37f14); color: #241d08;
      border: 3px solid var(--ink); border-radius: 16px 20px 14px 18px / 18px 14px 20px 16px;
      box-shadow: 0 5px 0 #4d3c08, 0 8px 20px rgba(0,0,0,.5);
      letter-spacing: 6px;
    }
    #start-btn:disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
    #start-btn:not(:disabled):hover { transform: translateY(-2px); }
    #start-btn:not(:disabled):active { transform: translateY(3px); box-shadow: 0 2px 0 #4d3c08; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    #crosshair {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 22px; height: 22px; opacity: .85;
    }
    #vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(10,6,2,.55) 100%);
      mix-blend-mode: multiply;
    }
    #damage-flash {
      position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(150,20,10,.55) 100%);
    }

    /* 左下:状态条 */
    #stats-panel { position: absolute; left: 22px; bottom: 20px; width: 300px; }
    .bar-wrap { position: relative; height: 24px; margin-top: 7px;
      background: rgba(20,16,10,.75); border: 2px solid var(--ink); border-radius: 8px 10px 9px 11px; overflow: hidden; }
    .bar-fill { position: absolute; inset: 0; transform-origin: left; transition: transform .18s ease; }
    #hp-fill { background: linear-gradient(#95b950, #66883a); }
    #mp-fill { background: linear-gradient(#5b8fb9, #3d6a8f); }
    #xp-wrap { height: 12px; }
    #xp-fill { background: linear-gradient(#e0c04a, #b3901f); }
    .bar-text {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #f4ecd8; text-shadow: 0 1px 2px #000; letter-spacing: 1px;
    }
    #level-badge {
      position: absolute; left: -14px; top: -16px; width: 52px; height: 52px; z-index: 2;
      background: radial-gradient(#e2d4ae, #b3a175); border: 3px solid var(--ink); border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--ink); font-size: 20px; font-weight: bold; box-shadow: 0 3px 8px rgba(0,0,0,.5);
    }
    #level-badge small { font-size: 9px; margin-top: -4px; }
    #stats-panel .inner { position: relative; padding-left: 34px; }

    /* 底部中间:技能栏 + 装备栏 */
    #action-bar {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; gap: 22px; align-items: flex-end; pointer-events: none;
    }
    #skill-bar { display: flex; gap: 12px; }
    .skill-slot {
      width: 64px; height: 64px; position: relative;
      background: rgba(24,19,12,.85); border: 3px solid #6d5c35; border-radius: 10px 12px 11px 13px;
      box-shadow: 0 3px 10px rgba(0,0,0,.5);
    }
    .skill-slot canvas { width: 100%; height: 100%; border-radius: 8px; display: block; }
    .skill-slot .key {
      position: absolute; left: -6px; top: -10px; width: 24px; height: 24px; z-index: 3;
      background: #d8c9a3; color: var(--ink); border: 2px solid var(--ink); border-radius: 6px;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;
    }
    .skill-slot .cd {
      position: absolute; inset: 0; z-index: 2; border-radius: 8px;
      background: conic-gradient(rgba(5,3,1,.85) var(--cd, 0%), transparent 0);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; text-shadow: 0 1px 3px #000;
    }
    .skill-slot .lvl-pips { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 3px; z-index: 3; }
    .skill-slot .pip { width: 8px; height: 8px; border-radius: 50%; background: #443a26; border: 1px solid var(--ink); }
    .skill-slot .pip.on { background: var(--gold); }
    .skill-slot.locked { filter: grayscale(1) brightness(.55); }
    .skill-slot.nomana canvas { filter: saturate(.3) brightness(.7) hue-rotate(180deg); }
    .skill-slot .up-btn {
      position: absolute; right: -8px; top: -12px; z-index: 4; width: 24px; height: 24px;
      background: var(--gold); color: #241d08; border: 2px solid var(--ink); border-radius: 50%;
      font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: auto; animation: pulse 1s infinite alternate;
    }
    #item-bar { display: grid; grid-template-columns: repeat(4, 40px); gap: 5px; }
    .item-slot {
      width: 40px; height: 40px; position: relative; background: rgba(24,19,12,.8);
      border: 2px solid #6d5c35; border-radius: 6px 8px 7px 9px;
    }
    .item-slot img { width: 100%; height: 100%; border-radius: 5px; display: block; }
    .item-slot.potion .key { position: absolute; left: -5px; top: -7px; background: #d8c9a3; color: var(--ink);
      border: 2px solid var(--ink); border-radius: 4px; font-size: 10px; font-weight: bold; padding: 0 3px; }
    .item-slot.potion .count { position: absolute; right: 2px; bottom: 0; color: #fff; font-size: 13px; text-shadow: 0 1px 2px #000; }
    .item-slot.potion.empty img { filter: grayscale(1) brightness(.5); }
    .item-slot.potion.active { box-shadow: 0 0 10px #8fd06c; border-color: #8fd06c; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.25); box-shadow: 0 0 12px var(--gold); } }

    /* 中上:比分与时间 */
    #top-center { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center;
      color: #e8dcbb; text-shadow: 0 2px 3px #000; background: rgba(20,15,8,.6); border: 2px solid #6d5c35;
      border-radius: 10px 12px 11px 13px; padding: 3px 18px; }
    #score { font-size: 24px; letter-spacing: 2px; }
    #score .blue { color: #7ab8f0; } #score .red { color: #f07a6a; }
    #game-clock { font-size: 14px; color: #b3a175; }

    /* 右上:昼夜/金币/战绩 */
    #top-right { position: absolute; right: 20px; top: 16px; text-align: right; color: #e8dcbb;
      text-shadow: 0 2px 3px #000; }
    #day-clock { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
    #clock-canvas { width: 54px; height: 54px; }
    #phase-label { font-size: 16px; color: #b3a175; }
    .stat-row { font-size: 17px; margin-top: 4px; }
    .stat-row span { color: var(--gold); }
    #kill-feed { margin-top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .feed-row { font-size: 14px; background: rgba(20,15,8,.7); padding: 2px 10px; border-radius: 6px;
      animation: toast-in .25s ease; }
    .feed-row .blue { color: #7ab8f0; } .feed-row .red { color: #f07a6a; } .feed-row .neutral { color: #e0c060; }
    .feed-row i { color: #c9a227; font-style: normal; }

    /* 右下:小地图 */
    #minimap { position: absolute; right: 18px; bottom: 18px; width: 220px; height: 220px;
      border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.6); }

    /* 状态条上方:增益 */
    #buff-bar { position: absolute; left: 0; bottom: 100%; margin-bottom: 26px; display: flex; gap: 6px; flex-wrap: wrap; width: 340px; }
    .buff { font-size: 12px; color: #e8dcbb; background: rgba(20,15,8,.75); border: 2px solid; border-radius: 6px;
      padding: 1px 7px; text-shadow: 0 1px 2px #000; }

    /* 回城读条 */
    #recall-bar { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); width: 260px; text-align: center;
      color: #bcd8f0; font-size: 15px; text-shadow: 0 1px 3px #000; }
    #recall-bar .bar-wrap { height: 12px; }
    #recall-fill { background: linear-gradient(#7ab8f0, #3d6a9f); }

    /* 死亡遮罩 */
    #death-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: rgba(10,6,4,.35); color: #d8c9a3; text-shadow: 0 3px 6px #000; }
    #death-overlay h2 { font-size: 48px; letter-spacing: 8px; }
    #death-overlay .t { font-size: 22px; margin-top: 6px; }
    #death-overlay .t b { color: var(--gold); font-size: 30px; }
    #death-overlay small { margin-top: 8px; color: #9c8f6d; font-size: 15px; }

    /* 中上:提示横幅 */
    #banner {
      position: absolute; top: 16%; left: 50%; transform: translateX(-50%);
      font-size: 34px; color: #f0e6c8; text-shadow: 0 3px 6px #000, 0 0 24px rgba(220,180,80,.4);
      opacity: 0; transition: opacity .5s ease; text-align: center; letter-spacing: 4px; white-space: nowrap;
    }
    #subbanner {
      position: absolute; top: calc(16% + 48px); left: 50%; transform: translateX(-50%);
      font-size: 17px; color: #cbbd97; text-shadow: 0 2px 4px #000; opacity: 0; transition: opacity .5s;
      white-space: nowrap;
    }

    /* 交互提示 */
    #interact-tip {
      position: absolute; left: 50%; top: 62%; transform: translateX(-50%);
      font-size: 20px; color: #f4ecd8; text-shadow: 0 2px 4px #000;
      background: rgba(20,15,8,.65); padding: 6px 18px; border-radius: 10px;
      border: 2px solid #6d5c35;
    }
    #interact-tip b { color: var(--gold); }

    /* 商店 */
    #shop { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 40;
      width: 760px; max-width: 94vw; max-height: 90vh; overflow-y: auto; padding: 18px 22px; pointer-events: auto; }
    .shop-head { display: flex; justify-content: space-between; align-items: baseline; }
    .shop-head h3 { font-size: 26px; transform: rotate(-.5deg); }
    .shop-gold { font-size: 22px; color: #6d4f08; }
    .shop-status { font-size: 14px; color: #4a3f2b; margin: 2px 0 10px; }
    .shop-status.bad { color: var(--blood); font-weight: bold; }
    .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .shop-item { display: flex; align-items: center; gap: 10px; text-align: left; font-family: var(--font);
      padding: 6px 10px; cursor: pointer; background: rgba(43,38,32,.08); color: var(--ink);
      border: 2px solid var(--ink); border-radius: 9px 12px 10px 13px; }
    .shop-item img { width: 40px; height: 40px; border-radius: 5px; flex-shrink: 0; }
    .shop-item .info { flex: 1; min-width: 0; }
    .shop-item b { font-size: 16px; display: block; }
    .shop-item small { font-size: 12px; opacity: .8; display: block; line-height: 1.3; }
    .shop-item .cost { font-size: 17px; color: #8a6a10; font-weight: bold; }
    .shop-item:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
    .shop-item:hover:not(:disabled) .cost { color: var(--gold); }
    .shop-item:disabled { opacity: .5; cursor: not-allowed; }
    .shop-item:disabled.affordable { opacity: .7; }
    .shop-owned { margin-top: 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #shop-owned { display: flex; gap: 6px; }
    .owned-item { width: 40px; height: 40px; padding: 0; border: 2px solid var(--ink); border-radius: 6px; cursor: pointer; background: none; }
    .owned-item img { width: 100%; height: 100%; display: block; border-radius: 4px; }
    .owned-item:hover:not(:disabled) { outline: 3px solid var(--blood); }
    .shop-foot { margin-top: 10px; font-size: 13px; color: #6d5c35; text-align: center; }

    /* 战绩表 */
    #scoreboard { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); z-index: 35;
      width: 860px; max-width: 96vw; padding: 14px 20px; pointer-events: none; }
    #scoreboard h3 { font-size: 22px; margin-bottom: 8px; }
    #scoreboard table { width: 100%; border-collapse: collapse; font-size: 15px; }
    #scoreboard th { text-align: left; padding: 6px 4px 3px; font-size: 14px; border-bottom: 2px solid var(--ink); }
    #scoreboard td { padding: 4px; border-bottom: 1px dashed rgba(43,38,32,.35); }
    #scoreboard tr.blue td:first-child { color: #2d5a8a; font-weight: bold; }
    #scoreboard tr.red td:first-child { color: #8f2f27; font-weight: bold; }
    #scoreboard tr.me { background: rgba(201,162,39,.25); }
    #scoreboard tr.dead { opacity: .55; }
    #scoreboard td.items img { width: 24px; height: 24px; margin-right: 2px; border-radius: 3px; vertical-align: middle; }

    /* 消息浮动条 */
    #toast-area { position: absolute; left: 50%; bottom: 180px; transform: translateX(-50%);
      display: flex; flex-direction: column-reverse; align-items: center; gap: 5px; }
    .toast {
      font-size: 16px; color: #f4ecd8; text-shadow: 0 1px 3px #000;
      background: rgba(20,15,8,.7); padding: 4px 16px; border-radius: 8px;
      animation: toast-in .25s ease, toast-out .6s ease 2.6s forwards; white-space: nowrap;
    }
    .toast.gold { color: #ecd67c; } .toast.bad { color: #e07a6d; } .toast.good { color: #a8d06c; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px);} }
    @keyframes toast-out { to { opacity: 0; transform: translateY(-14px);} }

    /* Boss 血条 */
    #boss-bar { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); width: 520px; max-width: 80vw; transition: opacity .4s; }
    #boss-bar.far { opacity: .45; transform: translateX(-50%) scale(.75); }
    #boss-bar .name { text-align: center; color: #e8c9c0; font-size: 20px; text-shadow: 0 2px 4px #000; margin-bottom: 4px; }
    #boss-bar .bar-wrap { height: 18px; }
    #boss-fill { background: linear-gradient(#b04a3d, #7c281e); }

    /* 死亡/胜利画面 */
    #end-screen {
      position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at center, rgba(30,10,6,.82), rgba(8,4,2,.96));
    }
    #end-screen h1 { font-size: 64px; color: #d8c9a3; text-shadow: 0 5px 0 #000; letter-spacing: 10px; }
    #end-screen.victory h1 { color: #ecd67c; }
    #end-screen .detail { color: #b3a175; font-size: 20px; line-height: 1.8; text-align: center; }
    #end-screen button {
      font-family: var(--font); font-size: 22px; padding: 10px 44px; cursor: pointer; margin-top: 10px;
      background: var(--paper); border: 3px solid var(--ink); color: var(--ink);
      border-radius: 14px 18px 15px 17px;
    }
    #end-screen button:hover { background: #f0e4c0; }

    /* 帮助 */
    #help-tip { position: absolute; left: 22px; top: 16px; font-size: 13px; color: #8d8060;
      text-shadow: 0 1px 2px #000; line-height: 1.6; }
    #help-tip b { color: #b3a175; }

    /* 难度选择 */
    #difficulty { display: flex; gap: 14px; }
    .diff-btn { font-family: var(--font); font-size: 20px; padding: 6px 20px; cursor: pointer; color: var(--paper);
      background: rgba(43,38,32,.6); border: 2px solid #6d5c35; border-radius: 10px 13px 11px 14px; }
    .diff-btn small { display: block; font-size: 12px; color: #9c8f6d; }
    .diff-btn.selected { border-color: var(--gold); background: rgba(201,162,39,.2); box-shadow: 0 0 14px rgba(201,162,39,.35); }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- 英雄选择 -->
  <div id="hero-select">
    <h1>饥 荒 大 乱 斗</h1>
    <div class="subtitle">— 3 v 3 永夜峡谷 · 推倒敌方的暗影王座 —</div>
    <div id="hero-cards"></div>
    <div id="difficulty"></div>
    <button id="start-btn" disabled>进入峡谷</button>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="vignette"></div>
    <div id="damage-flash"></div>
    <svg id="crosshair" viewBox="0 0 22 22">
      <circle cx="11" cy="11" r="2.2" fill="none" stroke="#e8dcbb" stroke-width="1.6"/>
      <path d="M11 2 L11 6 M11 16 L11 20 M2 11 L6 11 M16 11 L20 11" stroke="#e8dcbb" stroke-width="1.6" stroke-linecap="round"/>
    </svg>

    <div id="help-tip">
      <b>WASD</b> 移动 · <b>鼠标</b> 视角 · <b>左键</b> 普攻<br>
      <b>Q / E / Shift / R</b> 技能 · <b>1~4</b> 加点<br>
      <b>B</b> 回城 · <b>P</b> 商店 · <b>F</b> 药膏 · <b>Tab</b> 战绩
    </div>

    <div id="stats-panel">
      <div class="inner">
        <div id="buff-bar"></div>
        <div id="level-badge"><span id="level-num">1</span><small>等级</small></div>
        <div class="bar-wrap"><div id="hp-fill" class="bar-fill"></div><div id="hp-text" class="bar-text"></div></div>
        <div class="bar-wrap"><div id="mp-fill" class="bar-fill"></div><div id="mp-text" class="bar-text"></div></div>
        <div class="bar-wrap" id="xp-wrap"><div id="xp-fill" class="bar-fill"></div></div>
      </div>
    </div>

    <div id="action-bar">
      <div id="skill-bar"></div>
      <div id="item-bar"></div>
    </div>

    <div id="top-center">
      <div id="score"></div>
      <div id="game-clock">00:00</div>
    </div>

    <div id="top-right">
      <div id="day-clock">
        <div id="phase-label">白昼</div>
        <canvas id="clock-canvas" width="128" height="128"></canvas>
      </div>
      <div class="stat-row">💰 <span id="gold-num">0</span></div>
      <div class="stat-row">⚔ <span id="kda-num">0 / 0 / 0</span></div>
      <div class="stat-row">🗡 补刀 <span id="cs-num">0</span></div>
      <div id="kill-feed"></div>
    </div>

    <canvas id="minimap" width="220" height="220"></canvas>

    <div id="boss-bar" class="hidden">
      <div class="name" id="boss-name">树精巨人</div>
      <div class="bar-wrap"><div id="boss-fill" class="bar-fill"></div></div>
    </div>

    <div id="recall-bar" class="hidden">回城中……
      <div class="bar-wrap"><div id="recall-fill" class="bar-fill"></div></div>
    </div>

    <div id="death-overlay" class="hidden">
      <h2>你阵亡了</h2>
      <div class="t"><b id="death-timer">0</b> 秒后在泉水复活</div>
      <small>可以按 P 购买装备 · 按住 Tab 查看战绩</small>
    </div>

    <div id="banner"></div>
    <div id="subbanner"></div>
    <div id="interact-tip" class="hidden"></div>
    <div id="toast-area"></div>
  </div>

  <!-- 商店 -->
  <div id="shop" class="paper-panel hidden"></div>

  <!-- 战绩表 -->
  <div id="scoreboard" class="paper-panel hidden"></div>
