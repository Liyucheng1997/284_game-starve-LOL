<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>饥荒大乱斗 · Don't Starve LOL</title>
  <style>
    :root {
      --ink: #2b2620;
      --paper: #d8c9a3;
      --paper-dark: #b3a175;
      --blood: #8f2f27;
      --mana: #3d6a8f;
      --gold: #c9a227;
      --hp: #7a9c3e;
      --font: 'Segoe Print', 'KaiTi', '楷体', 'STKaiti', cursive, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #14110c; font-family: var(--font); }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- 通用 ---------- */
    .hidden { display: none !important; }
    .paper-panel {
      background: radial-gradient(ellipse at center, #e2d4ae 0%, #d8c9a3 55%, #c0ae82 100%);
      border: 3px solid var(--ink);
      border-radius: 14px 18px 15px 17px / 17px 14px 18px 15px;
      box-shadow: 0 6px 24px rgba(0,0,0,.6), inset 0 0 40px rgba(90,70,40,.25);
      color: var(--ink);
    }

    /* ---------- 英雄选择 ---------- */
    #hero-select {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #2a241a 0%, #14110c 80%);
      gap: 24px; padding: 20px;
    }
    #hero-select h1 {
      color: var(--paper); font-size: 52px; letter-spacing: 8px;
      text-shadow: 0 4px 0 #000, 0 0 30px rgba(200,170,90,.35);
      transform: rotate(-1.2deg);
    }
    #hero-select .subtitle { color: #9c8f6d; font-size: 18px; margin-top: -14px; transform: rotate(.6deg); }
    #hero-cards { display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
    .hero-card {
      width: 240px; padding: 16px 16px 14px; cursor: pointer;
      transition: transform .15s ease; text-align: center; position: relative;
    }
    .hero-card:hover { transform: translateY(-8px) rotate(-.8deg) scale(1.03); }
    .hero-card.selected { outline: 4px solid var(--gold); transform: translateY(-8px) scale(1.04); }
    .hero-card canvas { width: 150px; height: 150px; image-rendering: auto; }
    .hero-card h2 { font-size: 26px; margin: 6px 0 2px; }
    .hero-card .role { font-size: 14px; color: #6d5c35; margin-bottom: 8px; }
    .hero-card .skills { text-align: left; font-size: 13px; line-height: 1.45; }
    .hero-card .skills b { color: var(--blood); }
    #start-btn {
      font-family: var(--font); font-size: 26px; padding: 12px 60px; cursor: pointer;
      background: linear-gradient(#c9a227, #a37f14); color: #241d08;
      border: 3px solid var(--ink); border-radius: 16px 20px 14px 18px / 18px 14px 20px 16px;
      box-shadow: 0 5px 0 #4d3c08, 0 8px 20px rgba(0,0,0,.5);
      letter-spacing: 6px;
    }
    #start-btn:disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
    #start-btn:not(:disabled):hover { transform: translateY(-2px); }
    #start-btn:not(:disabled):active { transform: translateY(3px); box-shadow: 0 2px 0 #4d3c08; }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    #crosshair {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: 22px; height: 22px; opacity: .85;
    }
    #vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(10,6,2,.55) 100%);
      mix-blend-mode: multiply;
    }
    #damage-flash {
      position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(150,20,10,.55) 100%);
    }

    /* 左下:状态条 */
    #stats-panel { position: absolute; left: 22px; bottom: 20px; width: 300px; }
    .bar-wrap { position: relative; height: 24px; margin-top: 7px;
      background: rgba(20,16,10,.75); border: 2px solid var(--ink); border-radius: 8px 10px 9px 11px; overflow: hidden; }
    .bar-fill { position: absolute; inset: 0; transform-origin: left; transition: transform .18s ease; }
    #hp-fill { background: linear-gradient(#95b950, #66883a); }
    #mp-fill { background: linear-gradient(#5b8fb9, #3d6a8f); }
    #xp-wrap { height: 12px; }
    #xp-fill { background: linear-gradient(#e0c04a, #b3901f); }
    .bar-text {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #f4ecd8; text-shadow: 0 1px 2px #000; letter-spacing: 1px;
    }
    #level-badge {
      position: absolute; left: -14px; top: -16px; width: 52px; height: 52px; z-index: 2;
      background: radial-gradient(#e2d4ae, #b3a175); border: 3px solid var(--ink); border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--ink); font-size: 20px; font-weight: bold; box-shadow: 0 3px 8px rgba(0,0,0,.5);
    }
    #level-badge small { font-size: 9px; margin-top: -4px; }
    #stats-panel .inner { position: relative; padding-left: 34px; }

    /* 底部中间:技能栏 */
    #skill-bar {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: flex; gap: 12px; pointer-events: none;
    }
    .skill-slot {
      width: 64px; height: 64px; position: relative;
      background: rgba(24,19,12,.85); border: 3px solid #6d5c35; border-radius: 10px 12px 11px 13px;
      box-shadow: 0 3px 10px rgba(0,0,0,.5);
    }
    .skill-slot canvas { width: 100%; height: 100%; border-radius: 8px; }
    .skill-slot .key {
      position: absolute; left: -6px; top: -10px; width: 24px; height: 24px; z-index: 3;
      background: #d8c9a3; color: var(--ink); border: 2px solid var(--ink); border-radius: 6px;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;
    }
    .skill-slot .cd {
      position: absolute; inset: 0; z-index: 2; border-radius: 8px;
      background: conic-gradient(rgba(5,3,1,.85) var(--cd, 0%), transparent 0);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; text-shadow: 0 1px 3px #000;
    }
    .skill-slot .lvl-pips { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 3px; z-index: 3; }
    .skill-slot .pip { width: 8px; height: 8px; border-radius: 50%; background: #443a26; border: 1px solid var(--ink); }
    .skill-slot .pip.on { background: var(--gold); }
    .skill-slot.locked { filter: grayscale(1) brightness(.55); }
    .skill-slot .up-btn {
      position: absolute; right: -8px; top: -12px; z-index: 4; width: 24px; height: 24px;
      background: var(--gold); color: #241d08; border: 2px solid var(--ink); border-radius: 50%;
      font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: auto; animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.25); box-shadow: 0 0 12px var(--gold); } }

    /* 右上:时间/金币/击杀 */
    #top-right { position: absolute; right: 20px; top: 16px; text-align: right; color: #e8dcbb;
      text-shadow: 0 2px 3px #000; }
    #day-clock { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
    #clock-canvas { width: 64px; height: 64px; }
    #day-label { font-size: 24px; }
    #phase-label { font-size: 14px; color: #b3a175; }
    #gold-row, #kill-row { font-size: 19px; margin-top: 6px; }
    #gold-row span { color: var(--gold); }

    /* 中上:提示横幅 */
    #banner {
      position: absolute; top: 16%; left: 50%; transform: translateX(-50%);
      font-size: 34px; color: #f0e6c8; text-shadow: 0 3px 6px #000, 0 0 24px rgba(220,180,80,.4);
      opacity: 0; transition: opacity .5s ease; text-align: center; letter-spacing: 4px; white-space: nowrap;
    }
    #subbanner {
      position: absolute; top: calc(16% + 48px); left: 50%; transform: translateX(-50%);
      font-size: 17px; color: #cbbd97; text-shadow: 0 2px 4px #000; opacity: 0; transition: opacity .5s;
      white-space: nowrap;
    }

    /* 交互提示 */
    #interact-tip {
      position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
      font-size: 20px; color: #f4ecd8; text-shadow: 0 2px 4px #000;
      background: rgba(20,15,8,.65); padding: 6px 18px; border-radius: 10px;
      border: 2px solid #6d5c35;
    }
    #interact-tip b { color: var(--gold); }

    /* 奇遇对话框 */
    #event-dialog {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-52%);
      width: 460px; max-width: 92vw; z-index: 40; padding: 22px 26px; pointer-events: auto;
    }
    #event-dialog h3 { font-size: 26px; margin-bottom: 4px; transform: rotate(-.5deg); }
    #event-dialog .desc { font-size: 16px; line-height: 1.55; margin: 10px 0 16px; color: #4a3f2b; }
    .event-choice {
      display: block; width: 100%; text-align: left; font-family: var(--font); font-size: 17px;
      margin-top: 9px; padding: 9px 14px; cursor: pointer;
      background: rgba(43,38,32,.08); color: var(--ink);
      border: 2px solid var(--ink); border-radius: 9px 12px 10px 13px;
    }
    .event-choice:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
    .event-choice:disabled { opacity: .45; cursor: not-allowed; }
    .event-choice small { display: block; font-size: 12px; opacity: .75; }

    /* 消息浮动条 */
    #toast-area { position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%);
      display: flex; flex-direction: column-reverse; align-items: center; gap: 5px; }
    .toast {
      font-size: 16px; color: #f4ecd8; text-shadow: 0 1px 3px #000;
      background: rgba(20,15,8,.7); padding: 4px 16px; border-radius: 8px;
      animation: toast-in .25s ease, toast-out .6s ease 2.6s forwards; white-space: nowrap;
    }
    .toast.gold { color: #ecd67c; } .toast.bad { color: #e07a6d; } .toast.good { color: #a8d06c; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px);} }
    @keyframes toast-out { to { opacity: 0; transform: translateY(-14px);} }

    /* Boss 血条 */
    #boss-bar { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 520px; max-width: 80vw; }
    #boss-bar .name { text-align: center; color: #e8c9c0; font-size: 20px; text-shadow: 0 2px 4px #000; margin-bottom: 4px; }
    #boss-bar .bar-wrap { height: 18px; }
    #boss-fill { background: linear-gradient(#b04a3d, #7c281e); }

    /* 死亡/胜利画面 */
    #end-screen {
      position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at center, rgba(30,10,6,.82), rgba(8,4,2,.96));
    }
    #end-screen h1 { font-size: 64px; color: #d8c9a3; text-shadow: 0 5px 0 #000; letter-spacing: 10px; }
    #end-screen.victory h1 { color: #ecd67c; }
    #end-screen .detail { color: #b3a175; font-size: 20px; line-height: 1.8; text-align: center; }
    #end-screen button {
      font-family: var(--font); font-size: 22px; padding: 10px 44px; cursor: pointer; margin-top: 10px;
      background: var(--paper); border: 3px solid var(--ink); color: var(--ink);
      border-radius: 14px 18px 15px 17px;
    }
    #end-screen button:hover { background: #f0e4c0; }

    /* 帮助 */
    #help-tip { position: absolute; left: 22px; top: 16px; font-size: 13px; color: #8d8060;
      text-shadow: 0 1px 2px #000; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- 英雄选择 -->
  <div id="hero-select">
    <h1>饥 荒 大 乱 斗</h1>
    <div class="subtitle">— 选择你的英雄,在永夜降临前活下去 —</div>
    <div id="hero-cards"></div>
    <button id="start-btn" disabled>进入荒野</button>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="vignette"></div>
    <div id="damage-flash"></div>
    <svg id="crosshair" viewBox="0 0 22 22">
      <circle cx="11" cy="11" r="2.2" fill="none" stroke="#e8dcbb" stroke-width="1.6"/>
      <path d="M11 2 L11 6 M11 16 L11 20 M2 11 L6 11 M16 11 L20 11" stroke="#e8dcbb" stroke-width="1.6" stroke-linecap="round"/>
    </svg>

    <div id="help-tip">WASD 移动 · 鼠标转视角 · 左键普攻<br>Q / E / Shift / R 技能 · 1~4 加点 · F 互动</div>

    <div id="stats-panel">
      <div class="inner">
        <div id="level-badge"><span id="level-num">1</span><small>等级</small></div>
        <div class="bar-wrap"><div id="hp-fill" class="bar-fill"></div><div id="hp-text" class="bar-text"></div></div>
        <div class="bar-wrap"><div id="mp-fill" class="bar-fill"></div><div id="mp-text" class="bar-text"></div></div>
        <div class="bar-wrap" id="xp-wrap"><div id="xp-fill" class="bar-fill"></div></div>
      </div>
    </div>

    <div id="skill-bar"></div>

    <div id="top-right">
      <div id="day-clock">
        <div>
          <div id="day-label">第 1 天</div>
          <div id="phase-label">白昼</div>
        </div>
        <canvas id="clock-canvas" width="128" height="128"></canvas>
      </div>
      <div id="gold-row">💰 <span id="gold-num">0</span></div>
      <div id="kill-row">💀 <span id="kill-num">0</span></div>
    </div>

    <div id="boss-bar" class="hidden">
      <div class="name" id="boss-name">树精巨人</div>
      <div class="bar-wrap"><div id="boss-fill" class="bar-fill"></div></div>
    </div>

    <div id="banner"></div>
    <div id="subbanner"></div>
    <div id="interact-tip" class="hidden"></div>
    <div id="toast-area"></div>
  </div>

  <!-- 奇遇对话框 -->
  <div id="event-dialog" class="paper-panel hidden">
    <h3 id="event-title"></h3>
    <div class="desc" id="event-desc"></div>
    <div id="event-choices"></div>
  </div>

  <!-- 结算画面 -->
  <div id="end-screen" class="hidden">
    <h1 id="end-title">你死了</h1>
    <div class="detail" id="end-detail"></div>
    <button onclick="location.reload()">再来一局</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
